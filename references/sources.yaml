last_checked: "2026-06-29"
checked_by: "codex"
policy:
  current_or_local_claims:
    - "Use official veterinary, university, regulator, or public-health sources."
    - "If current official sources cannot be verified, say so and avoid current-year or local-protocol claims."
  professional_sources:
    - "Do not reproduce drug doses, anesthesia protocols, or procedure steps intended for veterinarians."
    - "Use professional sources for risk framing and explain that treatment decisions require a veterinarian."
sources:
  - id: "wsava-global-guidelines"
    name: "WSAVA Global Guidelines"
    url: "https://wsava.org/global-guidelines/"
    version: "continuously updated"
    topics: ["vaccination", "nutrition", "pain", "animal welfare"]
    update_trigger: "when user asks for latest/current guidance or specific intervals"
  - id: "wsava-vaccination-2024"
    name: "WSAVA Vaccination Guidelines"
    url: "https://wsava.org/global-guidelines/vaccination-guidelines/"
    version: "2024"
    topics: ["vaccination", "core vaccines", "non-core vaccines", "risk stratification"]
    update_trigger: "when vaccine protocol details or current-year claims are needed"
