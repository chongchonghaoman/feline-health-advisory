last_checked: "2026-07-01"
checked_by: "codex"
policy:
  single_source_of_truth: "This file is the structured source registry. source_registry.md is a human-readable summary; authoritative_sources.md is background only."
  current_or_local_claims:
    - "Use official veterinary, university, regulator, or public-health sources."
    - "If current official sources cannot be verified, say so and avoid current-year, local-protocol, legal, purchasing, or recall conclusions."
  professional_sources:
    - "Do not reproduce drug doses, anesthesia protocols, toxin treatment protocols, insulin adjustments, or procedure steps intended for veterinarians."
    - "Use professional sources for risk framing, tests a veterinarian may consider, and why veterinary care matters."
  fallback:
    urgent_or_toxin_no_web: "Do not keep researching; tell the user to contact an emergency veterinarian, poison hotline, or nearest clinic with emergency capacity."
    recall_no_web: "Ask the user to check FDA/AVMA, brand, or local regulator pages, keep package/lot photos, and seek care if symptomatic."
    vaccine_or_parasite_local_no_web: "Explain principles only; avoid current local schedules or regional risk claims."
    fip_or_regulated_treatment_no_web: "Say availability and legality require local veterinarian verification; do not provide purchasing or regulatory bypass advice."
