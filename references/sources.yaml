    version: "continuously updated landing page"
    topics: ["vaccination", "nutrition", "pain", "animal welfare"]
    audience: "veterinary"
    dose_leak_risk: "medium"
    requires_web: true
    fallback_action: "Use principles only; verify current guideline page before naming latest versions."
    update_trigger: "when user asks for latest/current guidance or specific intervals"
